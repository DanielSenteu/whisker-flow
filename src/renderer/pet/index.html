<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; script-src 'self'"
    />
    <title>Whisker Flow Pet</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none;
        font-family: -apple-system, 'SF Pro Rounded', system-ui, sans-serif; }
      /* the pet and everything that follows it, moved along the bottom edge by JS */
      #dog { position: absolute; left: 0; bottom: 0; width: 380px; height: 540px; pointer-events: none; will-change: transform; }
      #pet { position: absolute; left: 55px; bottom: 0; width: 270px; height: 480px; transform-origin: 50% 100%;
        cursor: pointer; pointer-events: auto; filter: drop-shadow(0 8px 10px rgba(0,0,0,.3)); }
      #bubble {
        position: absolute; left: 16px; right: 16px; top: 8px; padding: 10px 14px; border-radius: 18px;
        background: rgba(255,255,255,.96); color: #2a1b3d; font-size: 15px; font-weight: 600; text-align: center;
        box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; transform: translateY(6px); transition: all .25s;
      }
      #bubble.show { opacity: 1; transform: none; }
      #bubble.offer { pointer-events: auto; }
      #bubble .offerbtns { display: flex; gap: 8px; justify-content: center; margin-top: 9px; }
      #bubble .offerbtns button { font: inherit; font-size: 13px; font-weight: 800; border: 0; border-radius: 999px; padding: 7px 15px; cursor: pointer; }
      #bubble .offerbtns .yes { color: #2b0f1d; background: linear-gradient(135deg,#ff8fb1,#ffc2a8); box-shadow: 0 3px 10px rgba(255,143,177,.45); }
      #bubble .offerbtns .no { color: #6b5b7b; background: #efe9f5; }
      #bubble::after { content: ''; position: absolute; bottom: -7px; left: 50%; width: 14px; height: 14px;
        background: inherit; transform: translateX(-50%) rotate(45deg); }
      #cmds { position: absolute; left: 0; bottom: 150px; display: flex; flex-direction: column; gap: 6px;
        opacity: 0; transform: translateX(-8px); transition: all .25s; pointer-events: none; }
      #cmds.show { opacity: 1; transform: none; pointer-events: auto; }
      #cmds button { font: inherit; font-size: 13px; font-weight: 700; color: #2b0f1d; border: 0; padding: 7px 14px;
        border-radius: 999px; background: linear-gradient(135deg,#ff8fb1,#ffc2a8); cursor: pointer;
        box-shadow: 0 4px 12px rgba(0,0,0,.25); }
      #cmds button:hover { filter: brightness(1.08); }
      #learn { position: absolute; right: 8px; top: 74px; font-size: 11px; font-weight: 700; color: #fff;
        background: rgba(40,20,60,.78); padding: 5px 10px; border-radius: 999px; opacity: 0; transition: opacity .4s; }
      #learn.show { opacity: 1; }
      /* the pack: small helper pups that appear next to the lead dog */
      #pack { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; pointer-events: none; }
      .pup { position: absolute; left: 0; bottom: 0; width: 110px; height: 196px; will-change: transform; transition: opacity .6s; }
      .pup.gone { opacity: 0; }
      .pup canvas { position: absolute; left: 0; bottom: 0; width: 110px; height: 196px; pointer-events: auto; cursor: pointer;
        filter: drop-shadow(0 5px 6px rgba(0,0,0,.3)); }
      .pup .info { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); width: 180px; text-align: center; pointer-events: none; }
      .pup .tag { display: inline-block; background: rgba(40,20,60,.88); color: #fff; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; }
      .pup .status { margin-top: 4px; font-size: 11.5px; font-weight: 600; color: #2a1b3d; background: rgba(255,255,255,.95); padding: 4px 9px; border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0,0,0,.25); display: inline-block; max-width: 176px; }
      .pup.working .status::before { content: '● '; color: #ff8fb1; animation: blink 1s infinite; }
      .pup.waiting .status { color: #7c6d8c; }
      .pup.done .status { background: #dcfce7; }
      .pup.done .status::before { content: '✓ '; color: #15803d; font-weight: 900; }
      .pup.error .status { background: #fee2e2; }
      .pup.error .status::before { content: '✗ '; color: #b91c1c; font-weight: 900; }
      @keyframes blink { 50% { opacity: .25; } }
      /* background pups: no body, just a status chip you can click to read its log */
      .pup.bg { width: 180px; height: auto; }
      .pup.bg canvas { display: none; }
      .pup.bg .info { position: relative; left: auto; bottom: auto; transform: none; width: 180px; pointer-events: auto; cursor: pointer; }
      .pup.bg .tag::after { content: ' · background'; font-weight: 600; opacity: .7; }
      .pup.bg .log { bottom: 64px; }
      .pup .log { position: absolute; left: 50%; bottom: 226px; transform: translateX(-50%); width: 240px; max-height: 190px; overflow: auto; display: none;
        background: rgba(30,16,48,.94); color: #f6f1ff; font-size: 11.5px; line-height: 1.45; padding: 9px 11px; border-radius: 12px; text-align: left; pointer-events: auto; }
      .pup .log.show { display: block; }
      .pup .log div { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
      /* the toy: drag it and let go to throw */
      #ball { position: absolute; left: 0; bottom: 0; width: 38px; height: 38px; margin-left: -19px; font-size: 34px; line-height: 38px;
        text-align: center; cursor: grab; will-change: transform; filter: drop-shadow(0 4px 4px rgba(0,0,0,.35)); }
      #ball.drag { cursor: grabbing; }
    </style>
  </head>
  <body>
    <div id="dog">
      <canvas id="pet" width="360" height="640"></canvas>
      <div id="bubble"></div>
      <div id="learn"></div>
      <div id="cmds">
        <button data-cmd="look">Look</button>
        <button data-cmd="fetch">Fetch</button>
        <button data-cmd="come">Come</button>
        <button data-cmd="sit">Sit</button>
        <button data-cmd="speak">Speak</button>
        <button data-cmd="jump">Jump</button>
        <button data-cmd="dance">Dance</button>
        <button data-cmd="sleep">Sleep</button>
      </div>
    </div>
    <div id="pack"></div>
    <div id="ball">🎾</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
